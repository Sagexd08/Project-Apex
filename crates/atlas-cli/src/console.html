<title>Bat DB console</title>
<style>
  :root { --bg:#0a0a0a; --fg:#ffffff; --mut:#a3a3a3; --line:#262626; --acc:#ffffff; --err:#f87171; color-scheme:dark; }
  body { margin:0 auto; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.5 Inter, Geist, system-ui, sans-serif; max-width:760px; }
  h1 { font-size:1.2rem; margin:.2rem 0 1rem; }
  label { display:block; margin:.7rem 0 .2rem; color:var(--mut); font-size:.85rem; }
  input, textarea, select, button { font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:6px; padding:.45rem .6rem; width:100%; box-sizing:border-box; }
  textarea { min-height:5.5rem; font-family:ui-monospace, monospace; font-size:.85rem; }
  button { width:auto; cursor:pointer; border-color:var(--acc); color:var(--acc); margin:.6rem .4rem 0 0; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  pre { border:1px solid var(--line); border-radius:6px; padding:.7rem; overflow:auto; white-space:pre-wrap; word-break:break-word; min-height:4rem; }
  .err { color:var(--err); }
  p.note { color:var(--mut); font-size:.85rem; }
</style>
</head>
<body>
<h1><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 365 160" aria-hidden="true" width="34" height="15" style="vertical-align:-1px;margin-right:10px">
<g ><path d="M 121 115 L 117 116 L 113 119 L 111 119 L 91 130 L 94 130 L 95 131 L 84 141 Z M 94 100 L 89 100 L 84 102 L 91 102 Z M 299 72 L 302 73 L 302 72 Z M 38 47 L 44 50 L 47 49 L 46 48 Z M 23 35 L 30 37 L 42 43 L 53 50 L 61 58 L 70 61 L 77 65 L 76 67 L 67 65 L 72 77 L 72 95 L 71 97 L 83 96 L 92 92 L 97 91 L 100 89 L 103 90 L 98 95 L 116 96 L 117 97 L 134 96 L 146 90 L 161 89 L 162 90 L 159 94 L 150 103 L 153 107 L 162 112 L 175 125 L 180 133 L 182 140 L 188 127 L 191 123 L 204 111 L 219 103 L 231 99 L 247 97 L 248 96 L 259 96 L 260 95 L 276 95 L 277 96 L 284 96 L 279 95 L 277 93 L 281 91 L 289 91 L 288 88 L 288 75 L 287 73 L 277 70 L 276 67 L 280 65 L 298 65 L 299 64 L 302 64 L 311 59 L 305 61 L 302 61 L 301 62 L 298 61 L 298 60 L 306 53 L 317 46 L 335 37 L 342 35 L 338 35 L 333 37 L 329 37 L 328 38 L 324 38 L 318 40 L 313 40 L 312 41 L 309 41 L 308 40 L 314 37 L 318 37 L 319 36 L 326 35 L 236 35 L 233 48 L 231 52 L 228 55 L 224 57 L 221 57 L 216 59 L 212 59 L 211 60 L 207 60 L 206 61 L 197 61 L 193 57 L 192 51 L 191 50 L 191 45 L 190 51 L 189 52 L 176 52 L 174 49 L 174 45 L 173 53 L 171 59 L 168 64 L 165 61 L 159 61 L 158 60 L 149 59 L 137 55 L 131 47 L 131 43 L 130 42 L 129 35 L 57 35 L 69 41 L 71 43 L 70 44 L 57 40 L 47 35 Z M 110 20 L 110 27 L 114 32 L 114 27 Z" fill="#FFFFFF" fill-rule="evenodd"/></g></svg>Bat DB console</h1>
<p class="note">Talks to this server's JSON API with your API key. The key stays in this page's memory only. Nothing here is a benchmark.</p>
<label for="key">API key (Bearer)</label>
<input id="key" type="password" autocomplete="off" spellcheck="false">
<label for="op">Operation</label>
<select id="op">
  <option value="count">GET /v1/count</option>
  <option value="insert">POST /v1/insert</option>
  <option value="search">POST /v1/search</option>
  <option value="fetch">POST /v1/fetch</option>
  <option value="delete">POST /v1/delete</option>
</select>
<label for="body">JSON body</label>
<textarea id="body" spellcheck="false"></textarea>
<button id="run" type="button">Send</button>
<label for="out">Response</label>
<pre id="out" role="status" aria-live="polite"></pre>
<script>
const TEMPLATES = {
  count: "",
  insert: '{"id": 1, "vector": [0.1, 0.2, 0.3, 0.4], "metadata": {"tag": "demo"}, "op_id": "demo-1"}',
  search: '{"vector": [0.1, 0.2, 0.3, 0.4], "k": 5, "metric": "cosine"}',
  fetch: '{"id": 1}',
  delete: '{"id": 1}'
};
const el = (id) => document.getElementById(id);
const setTemplate = () => { el("body").value = TEMPLATES[el("op").value]; };
el("op").addEventListener("change", setTemplate);
setTemplate();
el("run").addEventListener("click", async () => {
  const op = el("op").value, out = el("out");
  out.className = "";
  try {
    const res = await fetch("/v1/" + op, {
      method: op === "count" ? "GET" : "POST",
      headers: { "Authorization": "Bearer " + el("key").value, "Content-Type": "application/json" },
      body: op === "count" ? undefined : el("body").value
    });
    const text = await res.text();
    out.className = res.ok ? "" : "err";
    out.textContent = res.status + " " + text;
  } catch (e) {
    out.className = "err";
    out.textContent = "request failed: " + e.message;
  }
});
</script>
</body>

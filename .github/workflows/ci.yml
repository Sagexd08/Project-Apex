name: ci
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: production graph has no test-only features or hooks
        shell: bash
        run: ci/check-prod-graph.sh
  macos-evidence:
    # Real macOS run (Apple fsync semantics, APFS). Simulated crash enumeration + live-server e2e.
    # This is NOT power-loss evidence: no hardware power is cut in CI.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p atlas-engine --test crash_enumeration -- --nocapture
      - run: cargo test -p atlas-engine --test kill -- --nocapture
      - run: cargo build -p atlas-cli && bash scripts/e2e-lcf.sh
  coverage-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --fail-under-lines 80
      - uses: EmbarkStudios/cargo-deny-action@v2

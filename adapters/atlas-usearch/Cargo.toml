[package]
name = "atlas-usearch"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
atlas-core = { path = "../../crates/atlas-core" }
atlas-index = { path = "../../crates/atlas-index" }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
usearch = "=2.26.6"

[dev-dependencies]
atlas-core = { path = "../../crates/atlas-core", features = ["test-auth"] }
atlas-engine = { path = "../../crates/atlas-engine" }

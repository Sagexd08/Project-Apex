<text x="310" y="210" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#202020">01 / PRIMARY LOCKUPS</text><text x="310" y="237" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6E6E6E">Primary horizontal and vertical brand signatures</text><text x="310" y="272" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#202020">02 / INVERTED LOCKUPS</text><text x="310" y="299" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6E6E6E">Light logo treatments for dark backgrounds</text><text x="310" y="334" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#202020">03 / SYMBOLS</text><text x="310" y="361" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6E6E6E">Standalone mark, white, black and outline</text><text x="310" y="396" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#202020">04 / FAVICONS</text><text x="310" y="423" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6E6E6E">Scalable square SVG favicons from 16 to 512</text><text x="310" y="458" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#202020">05 / MONOCHROME</text><text x="310" y="485" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6E6E6E">One-colour logo variants</text><text x="310" y="520" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#202020">06 / STYLISTIC VARIANTS</text><text x="310" y="547" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6E6E6E">Solid, separated and hairline constructions</text><text x="310" y="582" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#202020">07 / GUIDELINES</text><text x="310" y="609" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6E6E6E">Complete vector brand guideline sheet</text>

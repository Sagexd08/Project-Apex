<section class="s dark" id="film-sec" aria-labelledby="film-h">
    <div class="wrap">
      <p class="mono lbl">Film</p>
      <h2 id="film-h">The mathematics, as a film.</h2>
      <p class="grey" style="margin-bottom:34px">Nine scenes, about ninety seconds. It plays when it scrolls into view. Pause, scrub, change speed or jump to a scene. Press K to play or pause.</p>
      <div class="film">
        <canvas id="film" role="img" aria-label="Animated explanation of the Prism mathematics. The caption below narrates each scene."></canvas>
        <div class="film-bar">
          <button class="btn" id="film-play" type="button">Play</button>
          <input id="film-seek" type="range" min="0" max="8700" step="1" value="0" aria-label="Seek">
          <span class="mono" id="film-time">0:00 / 1:27</span>
          <select id="film-speed" aria-label="Playback speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select>
        </div>
        <p class="mono film-title" id="film-title"></p>
        <p class="film-cap" id="film-cap" aria-live="polite"></p>
        <div class="film-chips" id="film-chips"></div>
      </div>
    </div>
  </section>
